stages:
  - verify
  - build

default:
  interruptible: true

python:
  stage: verify
  image: python:3.12
  before_script:
    - python -m pip install -r components/esp_iris/tools/requirements-dev.txt
  script:
    - cd components/esp_iris/tools
    - python -m ruff check --select E9,F63,F7,F82 iris_gateway tests
    - python -m pytest -q

frontend:
  stage: verify
  image: node:22
  script:
    - cd components/esp_iris/tools/frontend
    - npm ci
    - npm run test:unit
    - npm run build
  artifacts:
    paths:
      - components/esp_iris/tools/frontend/dist/
    expire_in: 7 days

esp32s31-examples:
  stage: build
  tags:
    - esp-idf
  script:
    - idf.py -C components/esp_iris/examples/minimal -B build-ci-tcp -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-tcp/sdkconfig build
    - idf.py -C components/esp_iris/examples/minimal -B build-ci-usb -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-usb/sdkconfig -D SDKCONFIG_DEFAULTS=sdkconfig.usb.defaults build
    - idf.py -C components/esp_iris/examples/minimal -B build-ci-usj -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-usj/sdkconfig -D SDKCONFIG_DEFAULTS=sdkconfig.usj.defaults build
    - idf.py -C components/esp_iris/examples/tcp_wifi -B build-ci-tcp-wifi -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-tcp-wifi/sdkconfig build
    - idf.py -C components/esp_iris/examples/tcp_pairing -B build-ci-tcp-pairing -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-tcp-pairing/sdkconfig build
    - idf.py -C components/esp_iris/examples/rpc_jobs -B build-ci-rpc-jobs -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-rpc-jobs/sdkconfig build
    - idf.py -C components/esp_iris/examples/display_input -B build-ci-display-input -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-display-input/sdkconfig build
    - idf.py -C components/esp_iris/examples/media_streams -B build-ci-media-streams -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-media-streams/sdkconfig build
    - idf.py -C components/esp_iris/examples/ota -B build-ci-recovery -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-recovery/sdkconfig -D SDKCONFIG_DEFAULTS=sdkconfig.recovery.defaults build
    - idf.py -C components/esp_iris/examples/ota -B build-ci-a -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-a/sdkconfig build
    - idf.py -C components/esp_iris/examples/ota -B build-ci-b -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-b/sdkconfig -D SDKCONFIG_DEFAULTS=sdkconfig.candidate.defaults build
    - idf.py -C components/esp_iris/examples/ota -B build-ci-rollback -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-rollback/sdkconfig -D SDKCONFIG_DEFAULTS=sdkconfig.rollback.defaults build
    - idf.py -C components/esp_iris/examples/ota -B build-ci-application -D SDKCONFIG=$CI_PROJECT_DIR/build-ci-application/sdkconfig -D SDKCONFIG_DEFAULTS=sdkconfig.application.defaults build
  artifacts:
    when: always
    paths:
      - build-ci-*/*.bin
      - build-ci-*/*.elf
      - build-ci-*/*.map
    expire_in: 14 days
